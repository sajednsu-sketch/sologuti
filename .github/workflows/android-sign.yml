name: Sign Sologuti Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    name: Build and sign Android release
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Check out Sologuti
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          mkdir -p "$ANDROID_HOME/bin"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-36"
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Configure Bubblewrap SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$BUBBLEWRAP_KEYSTORE_PASSWORD"
          test -n "$BUBBLEWRAP_KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          mkdir -p android-project
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-project/android.keystore
          cp twa-manifest.json android-project/twa-manifest.json
          node -e "const fs=require('fs'); const p='android-project/twa-manifest.json'; const m=JSON.parse(fs.readFileSync(p)); m.signingKey={path:'./android.keystore',alias:process.env.KEY_ALIAS}; fs.writeFileSync(p,JSON.stringify(m,null,2));"

      - name: Generate Android project
        shell: bash
        run: |
          bubblewrap update --directory="android-project" --manifest="android-project/twa-manifest.json" --skipVersionUpgrade

      - name: Build and sign APK and App Bundle
        shell: bash
        run: |
          cd android-project
          bubblewrap build --manifest="twa-manifest.json" --signingKeyPath="./android.keystore" --signingKeyAlias="$KEY_ALIAS" --skipPwaValidation

      - name: Verify signed outputs
        shell: bash
        run: |
          test -s android-project/app-release-signed.apk
          test -s android-project/app-release-bundle.aab
          jarsigner -verify -verbose -certs android-project/app-release-bundle.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android-project/app-release-signed.apk

      - name: Collect signed release files and remove temporary key
        shell: bash
        run: |
          mkdir -p signed-release
          cp android-project/app-release-signed.apk signed-release/Sologuti-signed.apk
          cp android-project/app-release-bundle.aab signed-release/Sologuti-release.aab
          sha256sum signed-release/* > signed-release/SHA256SUMS.txt
          rm -f android-project/android.keystore

      - name: Upload signed release files
        uses: actions/upload-artifact@v4
        with:
          name: sologuti-android-signed
          path: signed-release/*
          if-no-files-found: error
          retention-days: 30
