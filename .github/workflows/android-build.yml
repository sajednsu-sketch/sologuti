name: Build Sologuti Android

on:
  push:
    branches: [main]
    paths:
      - "twa-manifest.json"
      - ".github/workflows/android-build.yml"
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sologuti
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools,platforms;android-36,build-tools;36.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Configure Bubblewrap SDK paths
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          test -d "$ANDROID_HOME"
          bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_HOME"

      - name: Generate Android project
        run: bubblewrap update --skipVersionUpgrade

      - name: Build unsigned Android package
        run: bubblewrap build --skipSigning --skipPwaValidation

      - name: Collect Android build outputs
        shell: bash
        run: |
          mkdir -p build-artifacts
          find . -type f \( -name "*.aab" -o -name "*.apk" \) \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            -exec cp {} build-artifacts/ \;
          test -n "$(find build-artifacts -type f -print -quit)"
          ls -lh build-artifacts

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sologuti-android-unsigned
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 14
