name: Build Sologuti Android

on:
  push:
    paths:
      - "twa-manifest.json"
      - ".github/workflows/android-build.yml"
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sologuti
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runner already includes the Android SDK. Avoid the
      # setup-android action's legacy "tools" package, which is retired.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Configure Bubblewrap
        run: bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_HOME"

      - name: Generate Android project
        run: bubblewrap update --skipVersionUpgrade

      # This first cloud build verifies the Android project and produces an
      # unsigned bundle. A persistent upload keystore must be configured
      # before producing a Play Store-ready signed AAB.
      - name: Build unsigned Android package
        run: bubblewrap build --skipSigning

      - name: Collect Android build outputs
        shell: bash
        run: |
          mkdir -p build-artifacts
          find . -type f \( -name "*.aab" -o -name "*.apk" \) \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            -exec cp {} build-artifacts/ \;
          test -n "$(find build-artifacts -type f -print -quit)"

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sologuti-android-unsigned
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 14
