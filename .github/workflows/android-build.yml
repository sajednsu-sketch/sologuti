name: Build Sologuti Android

on:
  push:
    branches: [main]
    paths:
      - "twa-manifest.json"
      - ".github/workflows/android-build.yml"
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out Sologuti
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-36"
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Configure Bubblewrap SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"

      - name: Generate Android project without interactive setup
        shell: bash
        run: |
          mkdir -p android-project
          cp twa-manifest.json android-project/twa-manifest.json
          bubblewrap update --directory="android-project" --manifest="android-project/twa-manifest.json" --skipVersionUpgrade

      - name: Build unsigned Android package
        run: bubblewrap build --directory="android-project" --manifest="android-project/twa-manifest.json" --skipSigning --skipPwaValidation

      - name: Collect Android build outputs
        shell: bash
        run: |
          mkdir -p build-artifacts
          find android-project -type f \( -name "*.aab" -o -name "*.apk" \) -exec cp {} build-artifacts/ \;
          test -n "$(find build-artifacts -type f -print -quit)"
          ls -lh build-artifacts

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sologuti-android-unsigned
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 14
